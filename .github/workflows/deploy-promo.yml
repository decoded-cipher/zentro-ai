name: Deploy Promo Site

on:
  # push:
  #   branches: [master]
  #   paths:
  #     - 'apps/promo/**'
  #     - '.github/workflows/deploy-promo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Promo Site
        run: bun run build --filter=@zentro-ai/promo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/promo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4