name: AI Changelog

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  models: read
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Changelog (GitHub Models)
        uses: decoded-cipher/auto-changelog@v1.1.0
        with:
          output_path: CHANGELOG.md
          create_pr: true
          changelog_branch: auto/changelog
          base_branch: master
